services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt && python scripts/ingest.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
